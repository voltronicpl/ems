# =====================================================================
# EcoBss External v.3 -> ESPHome  (zamiennik firmware Arduino v4.0)
# Plytka: ESP32-WROVER-IE + THVD1450, falownik ECOBSS FLEX 3L (Modbus RTU)
# ESP jest MASTEREM magistrali RS485 (czyta i zapisuje rejestry).
# Adresy rejestrow wg PDF ECOBSS + potwierdzone testami 9.11.2026.
# =====================================================================
substitutions:
  name: ecobss
  friendly: "EcoBss"

esphome:
  name: ${name}
  friendly_name: ${friendly}
  on_boot:
    priority: 800
    then:
      - output.turn_off: self_reset      # IO2 trzymane LOW (zbocze = reset)
      - output.turn_on: rs485_power      # IO5 zasilanie THVD1450
      - delay: 10ms
      - output.turn_on: led_ready        # IO21 program dziala

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0            # logi przez WiFi (HA -> Logi)
  logs:
    modbus_controller.sensor: INFO
    sensor: INFO

api:
  encryption:
    key: !secret ecobss_api_key

ota:
  - platform: esphome
    password: !secret ecobss_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "ecobss-fallback"

captive_portal:
web_server:
  port: 80

# ---------------------- piny / diody ----------------------
output:
  - platform: gpio
    id: rs485_power
    pin: GPIO5
  - platform: gpio
    id: self_reset
    pin: GPIO2
  - platform: gpio
    id: led_ready
    pin: GPIO21

  - platform: gpio
    id: led_wifi            # IO15: miga szybko = laczy WiFi, swieci = polaczony
    pin: GPIO15
  - platform: gpio
    id: led_data            # IO19: miga przy ruchu na RS485
    pin: GPIO19

globals:
  - id: last_activity
    type: uint32_t
    initial_value: '0'
  - id: last_poll
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 1s               # odczyt falownika co "Interwal odczytu" sekund (ustawia EMS)
    then:
      - lambda: |-
          uint32_t now = millis();
          uint32_t every = (uint32_t)(id(poll_interval).state * 1000.0f);
          if (every < 5000) every = 5000;
          if (id(last_poll) == 0 || now - id(last_poll) >= every) {
            id(last_poll) = now;
            id(inv).update();
          }
  - interval: 100ms
    then:
      - lambda: |-
          if (wifi::global_wifi_component->is_connected()) id(led_wifi).turn_on();
          else if ((millis() / 100) & 1) id(led_wifi).turn_on();
          else id(led_wifi).turn_off();
  - interval: 50ms
    then:
      - lambda: |-
          uint32_t now = millis();
          bool active = id(last_activity) != 0 && (now - id(last_activity) < 150);
          if (active && ((now / 50) & 1)) id(led_data).turn_on();
          else id(led_data).turn_off();

binary_sensor:
  - platform: gpio
    id: btn_s1
    pin:
      number: GPIO39
      inverted: true
    on_press:
      then:
        - delay: 2s
        - if:
            condition:
              binary_sensor.is_on: btn_s1
            then:
              - button.press: restart_btn

button:
  - platform: restart
    id: restart_btn
    name: "Restart"

# ---------------------- RS485 / Modbus ----------------------
uart:
  id: rs485
  rx_pin: GPIO34
  tx_pin: GPIO33
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024
  debug:                    # RAW ramki w logach: TX = HA -> falownik, RX = falownik -> HA
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 5ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ' ');
          id(last_activity) = millis();

modbus:
  id: mb
  uart_id: rs485
  flow_control_pin: GPIO32   # DE + !RE
  send_wait_time: 250ms

modbus_controller:
  - id: inv
    modbus_id: mb
    address: 0x01
    update_interval: never     # odczyt wyzwala EMS przez encje "Interwal odczytu"
    command_throttle: 100ms
    offline_skip_updates: 2

# ---------------------- odczyty (te same encje co sniffer modbuis-falownik) ----------------------
